<!DOCTYPE html>
<html>
<head>
    <title>Rossum Agent API Reference</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233F8AE2'/%3E%3Cstop offset='100%25' stop-color='%23AE33EC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath stroke='url(%23g)' d='M1.4,10.8c0,0,1-2.2,3.8-3.8c2.8-1.6,5.2-1.4,5.2-1.4 M6.3,20.4c0,0-1.4-1.9-1.4-5.2s1.4-5.2,1.4-5.2M16.6,21.7c0,0-2.4,0.3-5.2-1.4c-2.8-1.6-3.8-3.8-3.8-3.8 M22.6,13.2c0,0-1,2.2-3.8,3.8c-2.8-1.6-5.2,1.4-5.2,1.4 M17.8,3.6c0,0,1.4,1.9,1.4,5.2c0,3.2-1.4,5.2-1.4,5.2 M7.4,2.3c0,0,2.4-0.3,5.2,1.4c2.8,1.6,3.8,3.8,3.8,3.8'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #version-bar {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
            font-family: Montserrat, sans-serif;
            font-size: 0.85rem;
        }
        #version-bar label {
            font-weight: 500;
            color: #333;
        }
        #version-select {
            padding: 0.25rem 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="version-bar">
        <label for="version-select">Version:</label>
        <select id="version-select"></select>
    </div>
    <div id="redoc-container"></div>

    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    <script>
        const LATEST_SPEC = 'openapi.json';
        const VERSIONS_URL = 'specs/versions.json';

        function renderSpec(url) {
            document.getElementById('redoc-container').innerHTML = '';
            Redoc.init(url, {}, document.getElementById('redoc-container'));
        }

        function specUrlForVersion(version) {
            return 'specs/' + version + '.json';
        }

        async function init() {
            renderSpec(LATEST_SPEC);

            try {
                const resp = await fetch(VERSIONS_URL);
                if (!resp.ok) return;
                const versions = await resp.json();
                if (!versions.length) return;

                const bar = document.getElementById('version-bar');
                const select = document.getElementById('version-select');

                const latestOpt = document.createElement('option');
                latestOpt.value = '';
                latestOpt.textContent = 'latest';
                select.appendChild(latestOpt);

                for (const v of versions) {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    select.appendChild(opt);
                }

                select.addEventListener('change', function() {
                    const url = this.value ? specUrlForVersion(this.value) : LATEST_SPEC;
                    renderSpec(url);
                });

                bar.style.display = 'flex';
            } catch {
                // No versions available — just show latest
            }
        }

        init();
    </script>
</body>
</html>
