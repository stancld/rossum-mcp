# Workspace pyproject.toml for both rossum-mcp and rossum-agent
# This file allows installing both packages together during development

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rossum-workspace"
version = "1.0.0"
description = "Workspace for rossum-mcp and rossum-agent packages"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Dan Stancl (Rossum AI)", email = "daniel.stancl@gmail.com"}
]
keywords = ["mcp", "rossum", "document-processing", "agent", "ai"]
dependencies = [
    # Transitive dep (fastmcp -> authlib); pinned to fix Snyk SNYK-PYTHON-CRYPTOGRAPHY-15263096
    "cryptography>=46.0.5",
    "fastmcp>=3.0.0",
    "mcp>=1.0.0",
    "rossum-api>=3.12.0",
]

[project.optional-dependencies]
# Agent dependencies
agent = [
    "anthropic>=0.79.0",
    "boto3>=1.0",
    "ddgs>=9.9.0",
    "defusedxml>=0.7.0",
    "fastmcp>=3.0.0",
    "fpdf2>=2.8.0",
    "jinja2>=3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
]
# Agent API server
api = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.1.0",
    "python-multipart>=0.0.22",
    "redis>=7.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]
# Documentation
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.2",
    "furo",
]
# MCP server dependencies
mcp = [
    "fastmcp>=3.0.0",
    "mcp>=1.0.0",
]
# Testing
tests = [
    "coverage>=7.0.0",
    "gunicorn>=23.0.0",
    "pre-commit",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "slack-sdk[optional]>=3.27.0",
    "ty>=0.0.11",
]
# All dependencies
all = [
    "alembic>=1.13.0",
    "anthropic>=0.79.0",
    "boto3>=1.0",
    "coverage>=7.0.0",
    "ddgs>=9.9.0",
    "defusedxml>=0.7.0",
    "fastapi>=0.115.0",
    "fastmcp>=3.0.0",
    "fpdf2>=2.8.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.0",
    "mcp>=1.0.0",
    "myst-parser>=2.0.0",
    "pre-commit",
    "psycopg[binary]>=3.1.0",
    "python-dotenv",
    "python-multipart>=0.0.22",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pyyaml>=6.0",
    "redis>=7.0.0",
    "requests>=2.32",
    "rossum-api>=3.12.0",
    "slack-sdk[optional]>=3.27.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.2",
    "furo",
    "sse-starlette>=2.0.0",
    "tqdm>=4.66",
    "ty>=0.0.11",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
# diskcache uses pickle.load (CVE-2025-69872, SNYK-PYTHON-DISKCACHE-15268422).
# It's an unused transitive dep (fastmcp -> py-key-value-aio[disk]).
exclude-dependencies = ["diskcache"]

[tool.setuptools.packages.find]
where = ["rossum-mcp", "rossum-deploy", "rossum-agent", "rossum-agent-client"]
include = ["rossum_mcp*", "rossum_deploy*", "rossum_agent*", "rossum_agent_client*"]

[project.scripts]
rossum-mcp = "rossum_mcp.server:main"
rossum-agent-api = "rossum_agent.api.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests that test individual functions/methods in isolation",
]
testpaths = ["rossum-mcp/tests", "rossum-deploy/tests", "rossum-agent/tests", "rossum-agent-client/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.package-data]
rossum_agent = ["assets/*.png", "data/*.json"]



[tool.ty.environment]
python-version = "3.12"
extra-paths = ["rossum-mcp", "rossum-agent", "rossum-deploy", "rossum-agent-client"]

[tool.ty.src]
include = ["rossum-mcp", "rossum-agent", "rossum-deploy", "rossum-agent-client"]
exclude = ["**/tests/**", "**/outputs/**", "build/**"]

# FastAPI/Starlette middleware and Anthropic TypedDict literals
[[tool.ty.overrides]]
include = ["**/api/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
deprecated = "ignore"

# Redis async iterators return complex union types
[[tool.ty.overrides]]
include = ["**/redis_storage.py"]
[tool.ty.overrides.rules]
not-iterable = "ignore"
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"

# jq is a C extension without type stubs
[[tool.ty.overrides]]
include = ["**/subagents/elis_docs.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Alembic doesn't ship type stubs that ty can resolve
[[tool.ty.overrides]]
include = ["**/alembic/**", "**/postgres_storage.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
