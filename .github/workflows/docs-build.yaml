name: Documentation Build

# Trigger on push or pull request to master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docs-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra docs --no-install-project
        shell: bash

      - name: Install rossum-agent API dependencies
        run: |
          cd rossum-agent
          uv sync --extra api --no-install-project
        shell: bash

      - name: Build documentation
        run: |
          cd docs
          uv run make html
        shell: bash

      - name: Generate OpenAPI spec
        run: |
          cd rossum-agent
          uv run python scripts/generate_openapi.py
        shell: bash

      - name: Prepare site structure
        run: |
          # Create site directory with landing page at root
          mkdir -p _site
          cp -r docs/landing/* _site/
          # Move Sphinx docs to /source/ subdirectory
          cp -r docs/build/html _site/source
          # Add OpenAPI spec and Redoc viewer at /api-reference/
          mkdir -p _site/api-reference
          cp rossum-agent/rossum_agent/api/openapi.json _site/api-reference/openapi.json
          cp rossum-agent/scripts/openapi_redoc.html _site/api-reference/index.html
        shell: bash

      - name: Collect versioned API specs from GitHub Releases
        run: |
          mkdir -p _site/api-reference/specs
          versions=""
          for tag in $(gh release list --json tagName --jq '.[].tagName' | grep '^rossum-agent-v' | sort -Vr); do
            version="${tag#rossum-agent-v}"
            if gh release download "$tag" --pattern "openapi.json" --output "_site/api-reference/specs/${version}.json" 2>/dev/null; then
              versions="${versions}\"${version}\","
            fi
          done
          if [ -n "$versions" ]; then
            echo "[${versions%,}]" > _site/api-reference/specs/versions.json
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: _site/
        if: success()
