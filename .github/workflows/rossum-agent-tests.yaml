name: Rossum Agent Tests

# Trigger on push or pull request to master branch
on:
  push:
    branches: [master, ds-rossum-agent-release-branch-v2]
  pull_request:
    branches: [master, ds-rossum-agent-release-branch-v2]

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: rossum_agent
          POSTGRES_USER: rossum
          POSTGRES_PASSWORD: rossum
        options: >-
          --health-cmd "pg_isready -U rossum -d rossum_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra api --extra scripts --extra tests
        shell: bash
        working-directory: rossum-agent

      - name: Run tests
        run: |
          uv run coverage run --source=rossum_agent -m pytest tests -v --junitxml=report.xml
        shell: bash
        working-directory: rossum-agent

      - name: Upload pytest results
        uses: actions/upload-artifact@v4
        with:
          name: rossum-agent-test-report
          path: rossum-agent/report.xml
        if: failure()

      - name: Coverage statistics
        if: success() && matrix.python-version == '3.12'
        run: |
          uv run coverage xml
          uv run coverage report
        shell: bash
        working-directory: rossum-agent

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rossum-agent/coverage.xml
          flags: rossum-agent
          fail_ci_if_error: true
