name: Deploy Documentation to GitHub Pages

# Trigger only on push to master branch
on:
  push:
    branches: [master]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra docs --no-install-project
        shell: bash

      - name: Install rossum-agent API dependencies
        run: |
          cd rossum-agent
          uv sync --extra api --no-install-project
        shell: bash

      - name: Build documentation
        run: |
          cd docs
          uv run make html
        shell: bash

      - name: Generate OpenAPI spec
        run: |
          cd rossum-agent
          uv run python scripts/generate_openapi.py
        shell: bash

      - name: Prepare site structure
        run: |
          # Create site directory with landing page at root
          mkdir -p _site
          cp -r docs/landing/* _site/
          # Move Sphinx docs to /source/ subdirectory (latest)
          cp -r docs/build/html _site/source
          # Add OpenAPI spec and Redoc viewer at /api-reference/
          mkdir -p _site/api-reference
          cp rossum-agent/rossum_agent/api/openapi.json _site/api-reference/openapi.json
          cp rossum-agent/scripts/openapi_redoc.html _site/api-reference/index.html
        shell: bash

      - name: Collect versioned docs from GitHub Releases
        run: |
          doc_versions=""
          for tag in $(gh release list --json tagName --jq '.[].tagName' | grep -E '^rossum-(mcp|agent)-v' | sort -Vr); do
            # Extract package name and version from tag (e.g. rossum-mcp-v2.2.0 -> rossum-mcp, 2.2.0)
            package="${tag%-v*}"
            version="${tag#*-v}"
            dir_name="${package}-${version}"
            tmpdir=$(mktemp -d)
            if gh release download "$tag" --pattern "docs.tar.gz" --output "$tmpdir/docs.tar.gz" 2>/dev/null; then
              mkdir -p "_site/source/${dir_name}"
              tar xzf "$tmpdir/docs.tar.gz" -C "_site/source/${dir_name}"
              doc_versions="${doc_versions}\"${dir_name}\","
            fi
            rm -rf "$tmpdir"
          done
          if [ -n "$doc_versions" ]; then
            echo "[${doc_versions%,}]" > _site/source/versions.json
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Collect versioned API specs from GitHub Releases
        run: |
          mkdir -p _site/api-reference/specs
          versions=""
          for tag in $(gh release list --json tagName --jq '.[].tagName' | grep '^rossum-agent-v' | sort -Vr); do
            version="${tag#rossum-agent-v}"
            if gh release download "$tag" --pattern "openapi.json" --output "_site/api-reference/specs/${version}.json" 2>/dev/null; then
              versions="${versions}\"${version}\","
            fi
          done
          if [ -n "$versions" ]; then
            echo "[${versions%,}]" > _site/api-reference/specs/versions.json
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
